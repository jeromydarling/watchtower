name: Mint federation Stripe secrets

# Places the federation's Stripe signing keys with as little handling as the
# platforms allow.
#
# There is one secret to own: FEDERATION_MASTER_SECRET. Every satellite's key is
# HMAC-SHA256(master, satellite_slug), computed the same way here and inside the
# hub, so the two cannot drift. One satellite's key still cannot produce
# another's — the derivation is one-way — which is the property the fifteen
# separate secrets existed for. What it removes is fifteen chances to paste a
# value into the wrong box, a mistake that raises no error and surfaces weeks
# later on somebody's real payment.
#
# WHAT THIS RUN CAN DO
#   Cloudflare (9 Workers + 1 Pages project) — written directly. An API token
#   is all that is needed.
#
# WHAT IT CANNOT
#   Supabase. Those projects are administered through Lovable, so there is no
#   access token to give a runner. This job therefore computes those five keys
#   and prints them to the run summary for pasting into each project's Lovable
#   secret form. That is a deliberate, stated exposure: the values land in a
#   GitHub run summary readable by anyone with access to this repository.
#   Delete the run when you are done with it.
#
# SAFE TO RE-RUN. Nothing here mints anything — every value is derived from the
# master, so a re-run writes byte-identical keys. A half-finished run is
# repaired by running it again.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the plan and the fingerprints, write nothing"
        type: boolean
        required: false
        default: false
      show_supabase_keys:
        description: "Print the five Supabase keys in the summary (needed once, for pasting into Lovable)"
        type: boolean
        required: false
        default: false
      verify_supabase_keys:
        description: "Send each Supabase satellite a correctly-signed probe and report whether its pasted key matches"
        type: boolean
        required: false
        default: false
      deploy_stuck_versions:
        description: "If a worker refuses secret put because its latest version was never deployed, DEPLOY that version (changes which code serves traffic)"
        type: boolean
        required: false
        default: false

concurrency:
  group: federation-secrets
  cancel-in-progress: false

jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive and place
        env:
          FEDERATION_MASTER_SECRET: ${{ secrets.FEDERATION_MASTER_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY: ${{ inputs.dry_run }}
          SHOW_SUPABASE: ${{ inputs.show_supabase_keys }}
          DEPLOY_STUCK: ${{ inputs.deploy_stuck_versions }}
          VERIFY_SUPABASE: ${{ inputs.verify_supabase_keys }}
        run: |
          # GitHub runs this with `bash -e -o pipefail` already. `set -e` stays
          # on, which is why every fallible command below sits in an `if`
          # condition: a bare assignment from a failing command substitution
          # terminates the step instantly, taking the error message with it.
          set -uo pipefail

          [ -z "${FEDERATION_MASTER_SECRET:-}" ] && {
            echo "::error::FEDERATION_MASTER_SECRET repo secret is not set."; exit 1; }
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && {
            echo "::error::CLOUDFLARE_API_TOKEN repo secret is not set."; exit 1; }
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && {
            echo "::error::CLOUDFLARE_ACCOUNT_ID repo secret is not set."; exit 1; }

          # Byte-identical to the hub's hmacHex() in
          # supabase/functions/_shared/stripeHub/routing.ts — raw UTF-8 key,
          # SHA-256, lowercase hex. Verified equal across Node and WebCrypto.
          derive() {
            printf '%s' "$2" \
              | openssl dgst -sha256 -hmac "$1" -hex \
              | sed 's/^.*= //'
          }
          fp() { printf '%s' "$1" | sha256sum | cut -c1-8; }

          # slug | cloudflare worker name | host that actually serves it
          #
          # The worker name comes from what is DEPLOYED, not from the repo's
          # wrangler config. Those disagreed once already: the rezene repo
          # declares name "rezene", but the live worker is "verto" and
          # rezene.jer-f84.workers.dev 404s on every path. The secret went to
          # the dead one and wrangler reported success, because writing a
          # secret to a worker nobody calls is a perfectly successful write.
          CF_WORKERS=(
            "thriftos|thriftos|thriftos.jer-f84.workers.dev"
            "verto|verto|verto.jer-f84.workers.dev"
            "inmotu|inmotu|inmotu.jer-f84.workers.dev"
            "bushi|bushi|bushi.jer-f84.workers.dev"
            "laevo|laevo|laevo.us"
            "flavor|flavordoctors|flavordoctors.com"
            "tutela|viatutela|viatutela.jer-f84.workers.dev"
            "commissio|catholicart|commissio.dev"
            "sanctum|sanctum|sanctum.garden"
          )
          # heritage-catholic is a PAGES project — different command, and the
          # variable stays inert until production is redeployed.
          CF_PAGES="heritage|heritage-catholic"
          # slug | lovable project id — this runner cannot reach these.
          SUPABASE_SATS=(
            "aequitas|2bc89952-5f28-478b-b16f-ee009768643a"
            "custodia|df86f202-9f4d-4f7d-a371-e6297234aac9"
            "dominium|a20a1864-9bc5-471e-b09d-bcbbee6486b8"
            "vrt|e9f71251-f378-424c-a48b-18aec407be32"
            "convivium|47674420-bb7d-45d2-ac28-d9856ef1587f"
          )

          FAILED=0
          [ "$DRY" = "true" ] && echo "DRY RUN — nothing will be written."
          echo

          # Ask the satellite itself whether it has a usable secret. An
          # unsigned POST answers "federation_not_configured" when the secret
          # is missing and "missing_federation_signature" when it is present,
          # so the endpoint reports its own state without being sent anything.
          probe() {
            curl -s -X POST -H 'content-type: application/json' -d '{}' \
              --max-time 15 "https://$1/api/stripe/federation-in" 2>/dev/null | head -c 200
          }

          # A secret write publishes a new worker version, and the edge takes a
          # moment to serve it. Probing immediately reported verto as broken
          # when it was three seconds from correct, so give it room before
          # calling it a failure — and only wait when the answer is the one
          # that might still change.
          probe_settled() {
            local host="$1" answer=""
            for _ in 1 2 3 4; do
              answer=$(probe "$host")
              case "$answer" in *federation_not_configured*) sleep 12 ;; *) break ;; esac
            done
            printf '%s' "$answer"
          }

          echo "1. Cloudflare Workers"
          for row in "${CF_WORKERS[@]}"; do
            IFS='|' read -r slug worker host <<<"$row"
            key=$(derive "$FEDERATION_MASTER_SECRET" "$slug"); echo "::add-mask::$key"
            echo "  worker $worker  ($slug)  [$(fp "$key")]"
            [ "$DRY" = "true" ] && continue
            # stdin, never argv — keeps the key out of the process table.
            # stderr is captured rather than discarded: the first run of this
            # workflow failed on one worker and said only "FAILED", which is
            # the same amount of information as saying nothing.
            # A worker with an undeployed newer version refuses `secret put`
            # outright — Cloudflare will not let a secret edit implicitly
            # publish code nobody chose to publish. `versions secret put`
            # is the sanctioned way through: it writes the secret into a new
            # version without deploying anything. That version then has to be
            # rolled out, which is a decision about somebody's code, so this
            # says what it did and stops rather than promoting it.
            put_secret() {
              printf '%s' "$key" \
                | npx --yes wrangler@latest secret put FEDERATION_STRIPE_SECRET \
                    --name "$1" 2>&1 >/dev/null
            }
            # Keeps stdout as well as stderr: wrangler prints the new version's
            # id there, and that id is the only way to deploy exactly the
            # version that received the key rather than whatever is newest.
            put_version_secret() {
              printf '%s' "$key" \
                | npx --yes wrangler@latest versions secret put FEDERATION_STRIPE_SECRET \
                    --name "$1" --message "federation signing key" 2>&1
            }

            if err=$(put_secret "$worker"); then
              # wrangler exiting 0 means the API accepted the write, not that
              # the running satellite can now verify a signature. Ask it.
              answer=$(probe_settled "$host")
              case "$answer" in
                *missing_federation_signature*) echo "    ✓ set and confirmed live" ;;
                *federation_not_configured*)
                  echo "::error::worker $worker: wrangler wrote the secret but $host still reports federation_not_configured — the deployed worker is probably not this script"
                  FAILED=1 ;;
                *) echo "::warning::worker $worker: secret written; $host answered: $answer" ;;
              esac
            elif case "$err" in *"currently deployed"*) true ;; *) false ;; esac; then
              if verr=$(put_version_secret "$worker"); then
                # The refusal is about an undeployed version, which says nothing
                # about what is being served right now. A worker that took the
                # key on an earlier run is still serving it, so ask before
                # calling this a failure — sanctum was reported broken here
                # while answering correctly the whole time.
                answer=$(probe_settled "$host")
                case "$answer" in
                  *missing_federation_signature*)
                    echo "    ✓ already live (a newer undeployed version also received the key)"
                    continue ;;
                esac

                # Not serving it. Re-running cannot fix this: each attempt puts
                # the key in a fresh undeployed version, and deploying "the
                # latest version" by hand deploys whichever one is newest — not
                # necessarily the one holding the key. Only deploying this
                # specific version breaks the loop.
                version_id=$(printf '%s' "$verr" \
                  | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
                  | head -1)
                if [ "$DEPLOY_STUCK" != "true" ] || [ -z "$version_id" ]; then
                  echo "::warning::worker $worker: its latest version was never deployed, so the key went into version ${version_id:-<unknown>}, which $host is not serving. Re-running will not help — deploy that version, or re-run this workflow with deploy_stuck_versions ticked."
                  FAILED=1
                  continue
                fi
                echo "    deploying version $version_id (deploy_stuck_versions was ticked)"
                if derr=$(npx --yes wrangler@latest versions deploy "$version_id@100%" \
                            --name "$worker" --yes \
                            --message "deploy the version holding the federation key" 2>&1); then
                  case "$(probe_settled "$host")" in
                    *missing_federation_signature*) echo "    ✓ deployed and confirmed live" ;;
                    *) echo "::error::worker $worker: version $version_id deployed but $host still is not serving the key"
                       FAILED=1 ;;
                  esac
                else
                  echo "::error::worker $worker: could not deploy version $version_id: $derr"
                  FAILED=1
                fi
              else
                echo "::error::worker $worker: secret put refused (undeployed version) and versions secret put also failed: $verr"
                FAILED=1
              fi
            else
              echo "::error::worker $worker FAILED: $err"
              FAILED=1
            fi
          done
          echo

          echo "2. Cloudflare Pages"
          IFS='|' read -r slug proj <<<"$CF_PAGES"
          key=$(derive "$FEDERATION_MASTER_SECRET" "$slug"); echo "::add-mask::$key"
          echo "  pages $proj  ($slug)  [$(fp "$key")]"
          if [ "$DRY" != "true" ]; then
            if printf '%s' "$key" \
                 | npx --yes wrangler@latest pages secret put FEDERATION_STRIPE_SECRET \
                     --project-name "$proj" >/dev/null 2>&1
            then
              echo "    ✓ set"
              echo "::notice::heritage-catholic is a Pages project — the variable is inert until you redeploy production."
            else
              echo "::error::pages $proj FAILED (set it in the dashboard if 'pages secret' is unsupported)"
              FAILED=1
            fi
          fi
          echo

          # ── does each pasted key actually match? ───────────────────
          # Those five keys are the only ones a person copies by hand, and a
          # wrong one is invisible until a real payment routes: the satellite
          # answers invalid_federation_signature, which looks identical to a
          # bug anywhere else in the chain.
          #
          # So sign a probe the same way the hub does and see whether it
          # verifies. The envelope deliberately carries no usable event, so a
          # correct key gets past the signature check and then fails on the
          # missing event — a different error, which is the proof. Nothing is
          # processed and no subscription is touched.
          if [ "$VERIFY_SUPABASE" = "true" ] && [ "$DRY" != "true" ]; then
            echo "Verifying the five pasted Supabase keys"
            for row in "${SUPABASE_SATS[@]}"; do
              IFS='|' read -r slug proj <<<"$row"
              ref=""
              case "$slug" in
                aequitas)  ref=xhbvycoqezxydfxdrzgm ;;
                custodia)  ref=uoezwzidkrqnnjuavptf ;;
                dominium)  ref=bwlzckaymzlwvrijtcdv ;;
                vrt)       ref=enksexsysnyaothgsxnq ;;
                convivium) ref=tabszrpjqwkzvcxghfjw ;;
              esac
              key=$(derive "$FEDERATION_MASTER_SECRET" "$slug"); echo "::add-mask::$key"
              body="{\"hub_event_id\":\"key-check\",\"satellite_app\":\"$slug\",\"stripe_event\":null,\"delivered_at\":\"1970-01-01T00:00:00Z\"}"
              sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$key" -hex | sed 's/^.*= //')
              answer=$(curl -s -X POST \
                -H 'content-type: application/json' \
                -H "x-cros-federation-signature: $sig" \
                -d "$body" --max-time 20 \
                "https://$ref.supabase.co/functions/v1/stripe-in" | head -c 200)
              case "$answer" in
                *invalid_federation_signature*)
                  echo "::error::$slug: the key pasted into Lovable does not match the hub's. Re-paste it from the table below — copy the value only, no backticks or spaces."
                  FAILED=1 ;;
                *federation_not_configured*)
                  echo "::error::$slug: no FEDERATION_STRIPE_SECRET set at all."
                  FAILED=1 ;;
                *) echo "  ✓ $slug — signature verified (answered: $answer)" ;;
              esac
            done
            echo
          fi

          # ── the five this runner cannot reach ──────────────────────
          {
            echo "## Supabase satellites — paste these into Lovable"
            echo
            echo "These five projects are administered through Lovable, so no token"
            echo "here can write them. Open each project, ask for the secret form, and"
            echo "paste the value into \`FEDERATION_STRIPE_SECRET\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SHOW_SUPABASE" = "true" ] && [ "$DRY" != "true" ]; then
            echo "| satellite | Lovable project | FEDERATION_STRIPE_SECRET |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            for row in "${SUPABASE_SATS[@]}"; do
              IFS='|' read -r slug proj <<<"$row"
              key=$(derive "$FEDERATION_MASTER_SECRET" "$slug")
              echo "| $slug | [open](https://lovable.dev/projects/$proj) | \`$key\` |" >> "$GITHUB_STEP_SUMMARY"
            done
            {
              echo
              echo "> These are live signing keys sitting in a run summary. Delete this"
              echo "> workflow run once they are pasted."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "3. Five Supabase keys written to the run summary (see the Summary tab)."
          else
            echo "| satellite | Lovable project | key |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            for row in "${SUPABASE_SATS[@]}"; do
              IFS='|' read -r slug proj <<<"$row"
              key=$(derive "$FEDERATION_MASTER_SECRET" "$slug")
              echo "| $slug | [open](https://lovable.dev/projects/$proj) | fingerprint \`$(fp "$key")\` — re-run with **show_supabase_keys** to reveal |" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "3. Supabase keys withheld. Re-run with show_supabase_keys ticked to print them."
          fi
          echo

          # A partial run is the normal outcome here, not a disaster: one
          # stuck worker used to make the whole run say "failed", which reads
          # as "nothing happened" — including to somebody who had just had
          # five Supabase keys written to the summary and did not know it.
          # So the ending says what landed before it says what did not.
          echo "─────────────────────────"
          echo "Live and serving their key:"
          for row in "${CF_WORKERS[@]}"; do
            IFS='|' read -r slug worker host <<<"$row"
            case "$(probe "$host")" in
              *missing_federation_signature*) echo "  ✓ $slug" ;;
              *) echo "  ✗ $slug — see above" ;;
            esac
          done
          if [ "$SHOW_SUPABASE" = "true" ] && [ "$DRY" != "true" ]; then
            echo
            echo "The five Supabase keys ARE in this run's Summary tab, whatever the"
            echo "exit code below says. Paste them, then delete this run."
          fi
          if [ "$FAILED" = 1 ]; then
            echo "::error::Not everything landed — the list above says which. Re-running is"
            echo "::error::always safe: every key is derived, so a second run writes identical"
            echo "::error::values and only retries what is still missing."
            exit 1
          fi
          echo "Cloudflare done. Hub needs FEDERATION_MASTER_SECRET; five Supabase projects need their key."
