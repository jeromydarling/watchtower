name: Mint federation Stripe secrets

# Places the federation's Stripe signing keys with as little handling as the
# platforms allow.
#
# There is one secret to own: FEDERATION_MASTER_SECRET. Every satellite's key is
# HMAC-SHA256(master, satellite_slug), computed the same way here and inside the
# hub, so the two cannot drift. One satellite's key still cannot produce
# another's — the derivation is one-way — which is the property the fifteen
# separate secrets existed for. What it removes is fifteen chances to paste a
# value into the wrong box, a mistake that raises no error and surfaces weeks
# later on somebody's real payment.
#
# WHAT THIS RUN CAN DO
#   Cloudflare (9 Workers + 1 Pages project) — written directly. An API token
#   is all that is needed.
#
# WHAT IT CANNOT
#   Supabase. Those projects are administered through Lovable, so there is no
#   access token to give a runner. This job therefore computes those five keys
#   and prints them to the run summary for pasting into each project's Lovable
#   secret form. That is a deliberate, stated exposure: the values land in a
#   GitHub run summary readable by anyone with access to this repository.
#   Delete the run when you are done with it.
#
# SAFE TO RE-RUN. Nothing here mints anything — every value is derived from the
# master, so a re-run writes byte-identical keys. A half-finished run is
# repaired by running it again.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the plan and the fingerprints, write nothing"
        type: boolean
        required: false
        default: false
      show_supabase_keys:
        description: "Print the five Supabase keys in the summary (needed once, for pasting into Lovable)"
        type: boolean
        required: false
        default: false

concurrency:
  group: federation-secrets
  cancel-in-progress: false

jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive and place
        env:
          FEDERATION_MASTER_SECRET: ${{ secrets.FEDERATION_MASTER_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY: ${{ inputs.dry_run }}
          SHOW_SUPABASE: ${{ inputs.show_supabase_keys }}
        run: |
          set -uo pipefail

          [ -z "${FEDERATION_MASTER_SECRET:-}" ] && {
            echo "::error::FEDERATION_MASTER_SECRET repo secret is not set."; exit 1; }
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && {
            echo "::error::CLOUDFLARE_API_TOKEN repo secret is not set."; exit 1; }
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && {
            echo "::error::CLOUDFLARE_ACCOUNT_ID repo secret is not set."; exit 1; }

          # Byte-identical to the hub's hmacHex() in
          # supabase/functions/_shared/stripeHub/routing.ts — raw UTF-8 key,
          # SHA-256, lowercase hex. Verified equal across Node and WebCrypto.
          derive() {
            printf '%s' "$2" \
              | openssl dgst -sha256 -hmac "$1" -hex \
              | sed 's/^.*= //'
          }
          fp() { printf '%s' "$1" | sha256sum | cut -c1-8; }

          # slug | cloudflare worker name
          CF_WORKERS=(
            "thriftos|thriftos" "verto|rezene" "inmotu|inmotu" "bushi|bushi"
            "laevo|laevo" "flavor|flavordoctors" "tutela|viatutela"
            "commissio|catholicart" "sanctum|sanctum"
          )
          # heritage-catholic is a PAGES project — different command, and the
          # variable stays inert until production is redeployed.
          CF_PAGES="heritage|heritage-catholic"
          # slug | lovable project id — this runner cannot reach these.
          SUPABASE_SATS=(
            "aequitas|2bc89952-5f28-478b-b16f-ee009768643a"
            "custodia|df86f202-9f4d-4f7d-a371-e6297234aac9"
            "dominium|a20a1864-9bc5-471e-b09d-bcbbee6486b8"
            "vrt|e9f71251-f378-424c-a48b-18aec407be32"
            "convivium|47674420-bb7d-45d2-ac28-d9856ef1587f"
          )

          FAILED=0
          [ "$DRY" = "true" ] && echo "DRY RUN — nothing will be written."
          echo

          echo "1. Cloudflare Workers"
          for row in "${CF_WORKERS[@]}"; do
            IFS='|' read -r slug worker <<<"$row"
            key=$(derive "$FEDERATION_MASTER_SECRET" "$slug"); echo "::add-mask::$key"
            echo "  worker $worker  ($slug)  [$(fp "$key")]"
            [ "$DRY" = "true" ] && continue
            # stdin, never argv — keeps the key out of the process table.
            if printf '%s' "$key" \
                 | npx --yes wrangler@latest secret put FEDERATION_STRIPE_SECRET \
                     --name "$worker" >/dev/null 2>&1
            then echo "    ✓ set"; else echo "::error::worker $worker FAILED"; FAILED=1; fi
          done
          echo

          echo "2. Cloudflare Pages"
          IFS='|' read -r slug proj <<<"$CF_PAGES"
          key=$(derive "$FEDERATION_MASTER_SECRET" "$slug"); echo "::add-mask::$key"
          echo "  pages $proj  ($slug)  [$(fp "$key")]"
          if [ "$DRY" != "true" ]; then
            if printf '%s' "$key" \
                 | npx --yes wrangler@latest pages secret put FEDERATION_STRIPE_SECRET \
                     --project-name "$proj" >/dev/null 2>&1
            then
              echo "    ✓ set"
              echo "::notice::heritage-catholic is a Pages project — the variable is inert until you redeploy production."
            else
              echo "::error::pages $proj FAILED (set it in the dashboard if 'pages secret' is unsupported)"
              FAILED=1
            fi
          fi
          echo

          # ── the five this runner cannot reach ──────────────────────
          {
            echo "## Supabase satellites — paste these into Lovable"
            echo
            echo "These five projects are administered through Lovable, so no token"
            echo "here can write them. Open each project, ask for the secret form, and"
            echo "paste the value into \`FEDERATION_STRIPE_SECRET\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SHOW_SUPABASE" = "true" ] && [ "$DRY" != "true" ]; then
            echo "| satellite | Lovable project | FEDERATION_STRIPE_SECRET |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            for row in "${SUPABASE_SATS[@]}"; do
              IFS='|' read -r slug proj <<<"$row"
              key=$(derive "$FEDERATION_MASTER_SECRET" "$slug")
              echo "| $slug | [open](https://lovable.dev/projects/$proj) | \`$key\` |" >> "$GITHUB_STEP_SUMMARY"
            done
            {
              echo
              echo "> These are live signing keys sitting in a run summary. Delete this"
              echo "> workflow run once they are pasted."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "3. Five Supabase keys written to the run summary (see the Summary tab)."
          else
            echo "| satellite | Lovable project | key |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            for row in "${SUPABASE_SATS[@]}"; do
              IFS='|' read -r slug proj <<<"$row"
              key=$(derive "$FEDERATION_MASTER_SECRET" "$slug")
              echo "| $slug | [open](https://lovable.dev/projects/$proj) | fingerprint \`$(fp "$key")\` — re-run with **show_supabase_keys** to reveal |" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "3. Supabase keys withheld. Re-run with show_supabase_keys ticked to print them."
          fi
          echo

          echo "─────────────────────────"
          if [ "$FAILED" = 1 ]; then
            echo "::error::Some secrets did not land. Re-running is always safe — every key is"
            echo "::error::derived from the master, so a second run writes identical values."
            exit 1
          fi
          echo "Cloudflare done. Hub needs FEDERATION_MASTER_SECRET; five Supabase projects need their key."
