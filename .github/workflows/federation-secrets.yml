name: Mint federation Stripe secrets

# Places every FEDERATION_STRIPE_SECRET across the federation in one run:
# fifteen on the hub, one on each of fifteen satellites (five Supabase edge-
# function projects, nine Cloudflare Workers, one Cloudflare Pages project).
#
# Each pair value is generated on the runner and written to BOTH sides inside
# the same job. Nothing is copied by hand at any point, so a hub/satellite
# mismatch — which is silent, and only surfaces later as a rejected webhook —
# is not merely unlikely here but unrepresentable.
#
# Values never appear in the log. Every generated value is registered with
# ::add-mask:: the instant it exists, and the only thing printed is the first
# eight hex of its SHA-256: enough to see that both sides of a pair took the
# same value, useless for anything else.
#
# SAFE TO RE-RUN. A re-run mints fresh values and resets both sides together.
# Nothing is encrypted with the old value and no state depends on it, so a
# half-finished run is repaired by running it again — never by setting one
# side by hand, which is exactly how a mismatch gets created.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "What to write"
        type: choice
        required: true
        default: "all"
        options: ["all", "supabase-only", "cloudflare-only"]
      dry_run:
        description: "Print the plan and touch nothing"
        type: boolean
        required: false
        default: false

concurrency:
  group: federation-secrets
  cancel-in-progress: false

jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Place every secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGETS: ${{ inputs.targets }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail

          HUB_REF=zmeawjhxbgvtcfcfcygf

          # slug | hub secret suffix | supabase project ref
          SUPABASE_SATS=(
            "aequitas|AEQUITAS|xhbvycoqezxydfxdrzgm"
            "custodia|CUSTODIA|uoezwzidkrqnnjuavptf"
            "dominium|DOMINIUM|bwlzckaymzlwvrijtcdv"
            "vrt|VRT|enksexsysnyaothgsxnq"
            "convivium|CONVIVIUM|tabszrpjqwkzvcxghfjw"
          )
          # slug | hub secret suffix | cloudflare worker name
          CF_WORKERS=(
            "thriftos|THRIFTOS|thriftos"
            "verto|VERTO|rezene"
            "inmotu|INMOTU|inmotu"
            "bushi|BUSHI|bushi"
            "laevo|LAEVO|laevo"
            "flavor|FLAVOR|flavordoctors"
            "tutela|TUTELA|viatutela"
            "commissio|COMMISSIO|catholicart"
            "sanctum|SANCTUM|sanctum"
          )
          # heritage-catholic is a PAGES project, not a Worker — different command,
          # and a Pages variable stays inert until the next deploy.
          CF_PAGES="heritage|HERITAGE|heritage-catholic"

          want_supabase=0; want_cf=0
          case "$TARGETS" in
            all)             want_supabase=1; want_cf=1 ;;
            supabase-only)   want_supabase=1 ;;
            cloudflare-only) want_cf=1 ;;
          esac

          [ "$want_supabase" = 1 ] && [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && {
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is not set."; exit 1; }
          [ "$want_cf" = 1 ] && [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && {
            echo "::error::CLOUDFLARE_API_TOKEN repo secret is not set."; exit 1; }
          [ "$want_cf" = 1 ] && [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && {
            echo "::error::CLOUDFLARE_ACCOUNT_ID repo secret is not set."; exit 1; }

          fp() { printf '%s' "$1" | sha256sum | cut -c1-8; }
          FAILED=0
          ok()  { echo "  ✓ $1"; }
          bad() { echo "::error::$1"; FAILED=1; }

          # ── mint ───────────────────────────────────────────────────
          # Masked the moment each value exists, before it can reach a log
          # line, a command echo, or an error message.
          declare -A PAIR WEBHOOK
          for row in "${SUPABASE_SATS[@]}" "${CF_WORKERS[@]}" "$CF_PAGES"; do
            IFS='|' read -r slug _ _ <<<"$row"
            v=$(openssl rand -hex 32); echo "::add-mask::$v"; PAIR[$slug]=$v
          done
          for row in "${SUPABASE_SATS[@]}"; do
            IFS='|' read -r slug _ _ <<<"$row"
            v=$(openssl rand -hex 32); echo "::add-mask::$v"; WEBHOOK[$slug]=$v
          done
          echo "Minted ${#PAIR[@]} pair values + ${#WEBHOOK[@]} webhook values."
          [ "$DRY" = "true" ] && echo "DRY RUN — nothing will be written."
          echo

          # ── 1. the hub ─────────────────────────────────────────────
          if [ "$want_supabase" = 1 ]; then
            echo "1. Hub (thecros · $HUB_REF) — 15 secrets"
            args=()
            for row in "${SUPABASE_SATS[@]}" "${CF_WORKERS[@]}" "$CF_PAGES"; do
              IFS='|' read -r slug suffix _ <<<"$row"
              args+=("FEDERATION_STRIPE_SECRET_${suffix}=${PAIR[$slug]}")
              echo "  FEDERATION_STRIPE_SECRET_${suffix}  [$(fp "${PAIR[$slug]}")]"
            done
            if [ "$DRY" != "true" ]; then
              if supabase secrets set --project-ref "$HUB_REF" "${args[@]}" >/dev/null 2>&1
              then ok "hub: 15 secrets set"; else bad "hub: secrets set FAILED"; fi
            fi
            echo
          fi

          # ── 2. five Supabase satellites ────────────────────────────
          if [ "$want_supabase" = 1 ]; then
            echo "2. Supabase satellites"
            for row in "${SUPABASE_SATS[@]}"; do
              IFS='|' read -r slug suffix ref <<<"$row"
              echo "  $slug ($ref)  pair=[$(fp "${PAIR[$slug]}")]"
              [ "$DRY" = "true" ] && continue

              # FEDERATION_STRIPE_SECRET is ours to own — overwriting is the point.
              # STRIPE_WEBHOOK_SECRET is NOT: where one already exists it is signing
              # a live Stripe endpoint, and replacing it silently breaks every event
              # that endpoint sends. Only set when genuinely absent.
              set_args=("FEDERATION_STRIPE_SECRET=${PAIR[$slug]}")
              if supabase secrets list --project-ref "$ref" 2>/dev/null \
                   | grep -q '\bSTRIPE_WEBHOOK_SECRET\b'; then
                echo "    STRIPE_WEBHOOK_SECRET already present — left alone"
              else
                set_args+=("STRIPE_WEBHOOK_SECRET=${WEBHOOK[$slug]}")
                echo "    + new STRIPE_WEBHOOK_SECRET"
              fi
              if supabase secrets set --project-ref "$ref" "${set_args[@]}" >/dev/null 2>&1
              then ok "$slug"; else bad "$slug: secrets set FAILED"; fi
            done
            echo
          fi

          # ── 3. nine Cloudflare Workers ─────────────────────────────
          if [ "$want_cf" = 1 ]; then
            echo "3. Cloudflare Workers"
            for row in "${CF_WORKERS[@]}"; do
              IFS='|' read -r slug suffix worker <<<"$row"
              echo "  worker $worker  [$(fp "${PAIR[$slug]}")]"
              [ "$DRY" = "true" ] && continue
              # On stdin, never argv — keeps the value out of the process table.
              if printf '%s' "${PAIR[$slug]}" \
                   | npx --yes wrangler@latest secret put FEDERATION_STRIPE_SECRET \
                       --name "$worker" >/dev/null 2>&1
              then ok "worker $worker"; else bad "worker $worker FAILED"; fi
            done
            echo
          fi

          # ── 4. one Cloudflare Pages project ────────────────────────
          if [ "$want_cf" = 1 ]; then
            echo "4. Cloudflare Pages"
            IFS='|' read -r slug suffix proj <<<"$CF_PAGES"
            echo "  pages $proj  [$(fp "${PAIR[$slug]}")]"
            if [ "$DRY" != "true" ]; then
              if printf '%s' "${PAIR[$slug]}" \
                   | npx --yes wrangler@latest pages secret put FEDERATION_STRIPE_SECRET \
                       --project-name "$proj" >/dev/null 2>&1
              then
                ok "pages $proj"
                echo "::notice::heritage-catholic is a Pages project — the variable is inert until you redeploy production."
              else
                bad "pages $proj FAILED (set it in the dashboard if 'pages secret' is unsupported)"
              fi
            fi
            echo
          fi

          echo "─────────────────────────"
          if [ "$FAILED" = 1 ]; then
            echo "::error::Some secrets did not land. Re-run this whole workflow rather than"
            echo "::error::patching one entry — it mints a fresh pair and sets both sides, which"
            echo "::error::is always correct. Setting one side by hand is how a mismatch is made."
            exit 1
          fi
          if [ "$DRY" = "true" ]; then
            echo "Dry run complete. Fingerprints above should match between the hub list and each satellite."
          else
            echo "Every pair matched by construction. Tell Claude the secrets are in."
          fi
